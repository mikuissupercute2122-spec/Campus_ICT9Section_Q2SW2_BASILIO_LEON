<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q2 Seatwork 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #ffe4ec;
    }
    .navbar {
      background-color: #f8bbd0;
    }
    .logo {
      width: 35px;
      height: 35px;
      border-radius: 50%;
    }
  </style>
</head>
<body>


  <nav class="navbar navbar-light px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
      <img src="https://i.postimg.cc/J7snntvx/Screenshot-2026-11-25-at-10-42-22-AM-removebg-preview.png" alt="Logo" class="logo">
      <span>Contact Us</span>
    </a>
    <form class="d-flex">
      <input class="form-control form-control-sm me-2" type="search" placeholder="Search">
      <button class="btn btn-dark btn-sm" type="submit">Search</button>
    </form>
  </nav>


  <div class="container my-5">
    <div class="row g-4">

      <div class="col-md-7">
        <div class="bg-white p-4 rounded">
          <h1 class="h4 text-center mb-3">School Office Hours</h1>
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Day</th>
                <th>Office Hours</th>
                <th>Department</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Monday</td>
                <td>8:00 AM – 4:00 PM</td>
                <td>Clinic</td>
              </tr>
              <tr>
                <td>Tuesday</td>
                <td>8:00 AM – 4:00 PM</td>
                <td>ECO Office</td>
              </tr>
              <tr>
                <td>Wednesday</td>
                <td>8:00 AM – 4:00 PM</td>
                <td>Guidance Office</td>
              </tr>
              <tr>
                <td>Thursday</td>
                <td>8:00 AM – 4:00 PM</td>
                <td>Mrs. Lumboy's Office</td>
              </tr>
              <tr>
                <td>Friday</td>
                <td>8:00 AM – 3:00 PM</td>
                <td>Admin Office</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>


      <div class="col-md-5">
        <div class="bg-white p-4 rounded">
          <h2 class="h4 text-center mb-3">Contact Us</h2>
          <form>
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" placeholder="Enter your full name">
            </div>
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" placeholder="Enter your email">
            </div>
            <div class="mb-3">
              <label class="form-label">Subject</label>
              <input type="text" class="form-control" placeholder="Enter subject">
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="3" placeholder="Type your message here..."></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100">Send Message</button>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
